name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Dependencies
        run: |
          yarn install --frozen-lockfile
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Build Android Release (Official)
        run: |
          cd android
          # -x lint dan -x test digunakan untuk mengabaikan error pengecekan library yang dihapus
          ./gradlew assembleOfficialRelease -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Desa-Cluring-APK
          path: android/app/build/outputs/apk/official/release/*.apk
