name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Dependencies
        run: |
          yarn install
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Bypass Manifest Validation & Cleanup
        run: |
          echo "Bypassing Bugsnag API Key validation..."
          
          find android -name "AndroidManifest.xml" -exec sed -i 's/${BugsnagAPIKey}/kunci_kosong/g' {} +
          
          find app -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i '/@react-native-firebase\/analytics/d' {} +
          find app -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i '/expo-av/d' {} +
          find app -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i '/react-native-katex/d' {} +
          find app -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i '/react-native-math-view/d' {} +
          find app -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i '/@bugsnag\/react-native/d' {} +
          
          find android/app/src/main/java -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i '/bugsnag/Id' {} + || true
          
          sed -i '/bugsnag/Id' android/app/build.gradle || true
          sed -i '/bugsnag/Id' android/build.gradle || true
          
          echo "Bypass and Cleanup done."

      - name: Generate Dummy Keystore & Build Release
        run: |
          echo "Generating dummy Keystore..."
          cd android/app
          # Membuat sertifikat "palsu" agar sistem Android mengizinkan pembuatan versi Release
          keytool -genkey -v -keystore dummy.keystore -alias cluring -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Desa Cluring, C=ID" -storepass rahasia123 -keypass rahasia123
          cd ..
          
          echo "Building Release APK with dummy Keystore..."
          # Membangun versi Release dan menyuntikkan sertifikat palsu tadi
          ./gradlew assembleOfficialRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/dummy.keystore \
            -Pandroid.injected.signing.store.password=rahasia123 \
            -Pandroid.injected.signing.key.alias=cluring \
            -Pandroid.injected.signing.key.password=rahasia123 \
            -x lint -x test --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Desa-Cluring-APK
          path: android/app/build/outputs/apk/official/release/*.apk
