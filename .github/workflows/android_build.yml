name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Dependencies
        run: |
          yarn install
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Cleanup Missing References
        run: |
          echo "Cleaning up code references..."
          # 1. Hapus referensi di JavaScript/TypeScript (Frontend)
          find app -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i '/@react-native-firebase\/analytics/d' {} +
          find app -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i '/expo-av/d' {} +
          find app -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i '/react-native-katex/d' {} +
          find app -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i '/react-native-math-view/d' {} +
          find app -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i '/@bugsnag\/react-native/d' {} +
          
          # 2. Hapus Bugsnag di level Android (File Java & Kotlin)
          # Perintah ini sekarang menyisir file .java DAN .kt
          find android/app/src/main/java -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i '/bugsnag/Id' {} + || true
          
          # 3. Hapus Bugsnag dari file konfigurasi Gradle
          sed -i '/bugsnag/Id' android/app/build.gradle || true
          sed -i '/bugsnag/Id' android/build.gradle || true
          
          echo "Cleanup done."

      - name: Build Android Release (Official)
        run: |
          cd android
          # Tambahkan --stacktrace agar jika error kita bisa lihat lebih detail
          ./gradlew assembleOfficialRelease -x lint -x test --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Desa-Cluring-APK
          path: android/app/build/outputs/apk/official/release/*.apk
